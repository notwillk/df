rules:
  - name: GitHub CLI is installed
    check: |
      test -x "$HOME/.local/bin/gh" &&
      "$HOME/.local/bin/gh" --version >/dev/null 2>&1
    fix: |
      set -euo pipefail

      case "$(uname -s)" in
        Linux)
          os="linux"
          ext="tar.gz"
          ;;
        Darwin)
          os="macOS"
          ext="zip"
          ;;
        *)
          echo "Unsupported OS: $(uname -s)" >&2
          exit 1
          ;;
      esac

      case "$(uname -m)" in
        x86_64)
          arch="amd64"
          ;;
        aarch64|arm64)
          arch="arm64"
          ;;
        *)
          echo "Unsupported architecture: $(uname -m)" >&2
          exit 1
          ;;
      esac

      version="$(
        curl -fsSLI -o /dev/null -w '%{url_effective}' \
          https://github.com/cli/cli/releases/latest |
        sed 's#.*/tag/v##'
      )"

      tmp="$(mktemp -d)"
      trap 'rm -rf "$tmp"' EXIT

      archive="gh_${version}_${os}_${arch}.${ext}"
      url="https://github.com/cli/cli/releases/download/v${version}/${archive}"

      mkdir -p "$HOME/.local/bin"

      case "$ext" in
        tar.gz)
          curl -fsSL "$url" | tar -xz -C "$tmp"
          cp "$tmp/gh_${version}_${os}_${arch}/bin/gh" "$HOME/.local/bin/gh"
          ;;
        zip)
          curl -fsSL "$url" -o "$tmp/gh.zip"
          unzip -q "$tmp/gh.zip" -d "$tmp"
          cp "$tmp/gh_${version}_${os}_${arch}/bin/gh" "$HOME/.local/bin/gh"
          ;;
      esac

    timeout: 10m

  - name: GitHub CLI is authenticated
    severity: warn
    check: gh auth status --active --hostname github.com
    hint: Run `gh auth login --hostname github.com` to authenticate.

  - name: Sync Git commit name from gh
    skip-if: '! gh auth status --active --hostname github.com >/dev/null 2>&1'
    check: |
      test "$(git config --global --get user.name)" = "$(gh api user --jq 'if (.name // "") == "" then .login else .name end')"
    fix: |
      git config --global user.name "$(gh api user --jq 'if (.name // "") == "" then .login else .name end')"

  - name: Sync Git commit email from gh
    skip-if: '! gh auth status --active --hostname github.com >/dev/null 2>&1'
    check: |
      test "$(git config --global --get user.email)" = "$(gh api user --jq '(.id | tostring) + "+" + .login + "@users.noreply.github.com"')"
    fix: |
      git config --global user.email "$(gh api user --jq '(.id | tostring) + "+" + .login + "@users.noreply.github.com"')"

  - name: Connect Git authentication to gh
    skip-if: '! gh auth status --active --hostname github.com >/dev/null 2>&1'
    check: |
      git config --global --get-all credential.https://github.com.helper | grep -Fq "gh auth git-credential"
    fix: |
      gh auth setup-git --hostname github.com
