rules:
  - name: Rulesy schema files are installed
    check: |
      [ -f "../../.schemas/rulesy.schema.json" ]
    fix: |
      mkdir -p ../../.schemas
      rulesy schema > ../../.schemas/rulesy.schema.json

  - name: Rulesy agent skill is installed for the configured agent
    skip-if: '[ -z "${AGENT_SKILL_HOST:-}" ]'
    check: |
      test "$(gh skill list --agent "$AGENT_SKILL_HOST" --scope user --json skillName --jq 'any(.[]; .skillName == "rulesy-workflow")')" = true
    fix: gh skill install notwillk/rulesy rulesy-workflow --agent "$AGENT_SKILL_HOST" --scope user
    timeout: 10m
