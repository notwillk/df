rules:
  - name: Codex CLI is installed
    skip-if: '[ "${GITHUB_ACTIONS:-}" = "true" ]'
    check: |
      test -x "$HOME/.local/bin/codex" &&
      "$HOME/.local/bin/codex" --version >/dev/null 2>&1
    fix: curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh
    timeout: 15m
