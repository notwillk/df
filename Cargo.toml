[workspace]
members = ["apps/cli"]
resolver = "3"

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
aws-lc-rs = { version = "1.18", default-features = false, features = ["non-fips"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
gix = { version = "0.86", default-features = false, features = ["auto-chain-error", "blocking-http-transport-reqwest-rust-tls", "sha1", "worktree-mutation"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
